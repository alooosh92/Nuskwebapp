<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة تضمين الموقع</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
        }
        h2 {
            color: #333;
        }
        .frame-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>تجربة عرض موقع داخل موقع خاص عبر iframe</h2>
    <p>الموقع التالي يتم عرضه داخل إطار ضمن صفحتك:</p>

    <div class="frame-container">
        <!-- استبدل الرابط أدناه بالموقع الذي تريد تجربته -->
        <iframe src="https://example.com"></iframe>
    </div>

</body>
</html>
